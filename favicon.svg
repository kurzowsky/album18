<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c172e"/>
      <stop offset="100%" stop-color="#090812"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe676"/>
      <stop offset="50%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#d49b04"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#f5c518" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Zaokrąglone tło z subtelną złotą obwódką -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Imprezowe gwiazdki -->
  <path d="M14 16 L15.5 11 L17 16 L22 17.5 L17 19 L15.5 24 L14 19 L9 17.5 Z" fill="url(#sparkleGrad)"/>
  <path d="M50 48 L51 44.5 L52 48 L55.5 49 L52 50 L51 53.5 L50 50 L46.5 49 Z" fill="url(#goldGrad)"/>

  <!-- Liczba 18 -->
  <text x="32" y="43" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1" filter="url(#goldGlow)">18</text>
</svg>
